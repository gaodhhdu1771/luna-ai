name: Build Luna AI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android project
        run: |
          set -e
          test -f luna-ai.html || { echo "luna-ai.html repo-র root-এ নেই"; exit 1; }
          mkdir -p app/src/main/assets app/src/main/res/values app/src/main/res/xml app/src/main/java/com/luna/ai
          cp luna-ai.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LunaAI"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.luna.ai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.luna.ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <application
                  android:label="Luna AI"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LunaAccessibilityService"
                      android:label="Luna AI"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="acc_desc">Luna AI accessibility support</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:description="@string/acc_desc" />
          EOF

          cat > app/src/main/java/com/luna/ai/LunaAccessibilityService.java <<'EOF'
          package com.luna.ai;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;

          public class LunaAccessibilityService extends AccessibilityService {
              @Override public void onAccessibilityEvent(AccessibilityEvent event) { }
              @Override public void onInterrupt() { }
          }
          EOF

          cat > app/src/main/java/com/luna/ai/MainActivity.java <<'EOF'
          package com.luna.ai;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA}, 1);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest r) {
                          runOnUiThread(new Runnable() {
                              public void run() { r.grant(r.getResources()); }
                          });
                      }
                  });
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Luna-AI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Luna-AI-APK
          path: Luna-AI.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Luna AI build ${{ github.run_number }}
          files: Luna-AI.apk
