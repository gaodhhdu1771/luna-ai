<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Luna Float</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: transparent !important;
      height: 100vh; width: 100vw;
      display: flex; justify-content: center; align-items: center; overflow: hidden; user-select: none;
    }
    .orb-wrap { position: relative; width: 120px; height: 120px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .glow { position: absolute; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(120, 150, 255, 0.4) 0%, rgba(160, 100, 255, 0.15) 45%, transparent 70%); filter: blur(15px); opacity: 0.75; animation: glowBreathe 3.4s ease-in-out infinite; }
    .orb { position: relative; width: 60px; height: 60px; border-radius: 50%; overflow: hidden; z-index: 10; box-shadow: 0 0 20px rgba(100, 140, 255, 0.35), inset 0 0 15px rgba(255, 255, 255, 0.12); animation: breathe 3.4s ease-in-out infinite; }
    .orb-aurora { position: absolute; inset: -30%; background: conic-gradient(from 0deg, #6b9fff, #c084fc, #f472b6, #67e8f9, #4ade80, #6b9fff); filter: blur(10px) saturate(1.3); animation: spin 9s linear infinite; }
    .orb-depth { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.45) 0%, rgba(180, 200, 255, 0.15) 25%, rgba(40, 70, 160, 0.35) 70%, rgba(15, 25, 60, 0.6) 100%); z-index: 2; }
    .orb-highlight { position: absolute; top: 9%; left: 20%; width: 36%; height: 26%; background: rgba(255, 255, 255, 0.6); border-radius: 50%; filter: blur(4px); z-index: 3; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes glowBreathe { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.15); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="orb-wrap" onclick="openMainApp()">
    <div class="glow"></div>
    <div class="orb">
      <div class="orb-aurora"></div>
      <div class="orb-depth"></div>
      <div class="orb-highlight"></div>
    </div>
  </div>
  <script>
    function openMainApp() {
      if (typeof LunaAndroid !== 'undefined') {
        LunaAndroid.invoke("luna", 999, "open_main_app", "{}");
      }
    }
  </script>
</body>
</html>
