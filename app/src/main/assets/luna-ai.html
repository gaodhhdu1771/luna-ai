</style></head><body><div id="app">

<script>
if(location.search.includes('mini=1'))document.documentElement.classList.add('mini');
const $=s=>document.querySelector(s);
const S=(k,d)=>{try{const v=localStorage.getItem('luna_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem('luna_'+k,JSON.stringify(v))}catch(e){}};
// আপনি যে মডেলটি চেয়েছেন সেটি সেট করা হলো
let cfg=S('cfg',{key:'',gnews:'',voice:'Aoede',model:'gemini-3.1-flash-live-preview', vision:true, taskTime:'', taskPrompt:''});
if(cfg.model !== 'gemini-3.1-flash-live-preview'){ cfg.model = 'gemini-3.1-flash-live-preview'; W('cfg', cfg); }
if(!cfg.gnews)cfg.gnews='1859b59abdb4444aa520afab7109e3dc';
if(!cfg.mode)cfg.mode='gf';

let soul=S('soul3','');
let mem=S('mem',[]),tasks=S('tasks',[{t:'Finish voice demo',d:0},{t:'Release desktop version',d:0},{t:'Upload video to TikTok',d:0}]);
let lastBuild=null,ws,on=false,muted=false,mic,ac,proc,pc,nextT=0,level=0,state='IDLE',vs,vt,facing='user',srcs=[],mode=null,fresh=true,autoReplyTimer=null;

setInterval(()=>{
  if(!on || !cfg.taskTime || !cfg.taskPrompt) return;
  const now = new Date();
  const currentTime = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

    cfg.taskTime = ''; W('cfg',cfg);
    send({realtimeInput:{text:`SYSTEM ALERT: It is ${currentTime}. Time to execute the scheduled task: ${cfg.taskPrompt}. Please do it now.`}});
  }
}, 60000);

function renderTasks(){$('#tasks').innerHTML=tasks.map((x,i)=>`<li class="${x.d?'done':''}" data-i="${i}">${x.t.replace(/</g,'&lt;')}</li>`).join('');W('tasks',tasks)}
$('#tasks').onclick=e=>{const i=e.target.dataset.i;if(i!=null){tasks[i].d^=1;renderTasks()}};
$('#addT').onclick=()=>{const t=prompt('New task');if(t){tasks.push({t,d:0});renderTasks()}};
async function news(){let h=['AI News Today: latest updates','Tech: new phones announced this week','World: markets open higher','Sports: weekend results'];
if(cfg.gnews){const r=await getNews('');if(r!='no news found')h=r.split(' | ')}
$('#news').innerHTML=h.slice(0,4).map(x=>`<li>${x.replace(/</g,'&lt;')}</li>`).join('')}
function setSt(s){state=s;$('#st').textContent=s; if(s=='SPEAKING') document.documentElement.classList.add('speaking'); else document.documentElement.classList.remove('speaking');}
function hint(t){$('#hint').textContent=t}
const cv=$('#orb'),cx=cv.getContext('2d'),W0=cv.width,H0=cv.height;
let tx=0,ty=0,ax=0,ay=0,ang=0,T=0;
addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*.9;ty=(e.clientY/innerHeight-.5)*.9});
addEventListener('deviceorientation',e=>{if(e.gamma!=null){tx=Math.max(-.5,Math.min(.5,e.gamma/60));ty=Math.max(-.5,Math.min(.5,(e.beta-45)/60))}});
const spr=(r,g,b)=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),q=x.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(.22,`rgba(${r},${g},${b},.85)`);q.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=q;x.fillRect(0,0,64,64);return c};
const SP=[spr(30,255,160),spr(40,225,255),spr(255,205,60),spr(130,255,225)];
const fib=(n,f)=>{const a=[];for(let i=0;i<n;i++){const y=1-2*i/(n-1),r=Math.sqrt(1-y*y),t=i*2.39996;a.push([Math.cos(t)*r,y,Math.sin(t)*r,f(i)])}return a};
const SH=fib(620,i=>i%9==0?2:i%3==0?1:0),IN=fib(200,i=>i%2?3:1);
const rot=(p,a,b)=>{const x=p[0]*Math.cos(a)-p[2]*Math.sin(a),z=p[0]*Math.sin(a)+p[2]*Math.cos(a);return[x,p[1]*Math.cos(b)-z*Math.sin(b),p[1]*Math.sin(b)+z*Math.cos(b)]};
const proj=(q,R,c)=>{const s=3/(3-q[2]);return[c[0]+q[0]*R*s,c[1]+q[1]*R*s,s]};
function draw(){T+=.016;const sp=state=='SPEAKING',li=state=='LISTENING';ang+=sp?.026:li?.015:.007;ax+=(tx-ax)*.06;ay+=(ty-ay)*.06;
cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.34)';cx.fillRect(0,0,W0,H0);cx.globalCompositeOperation='lighter';
const c=[W0/2,H0/2],R=215*(1+level*.3+Math.sin(T*1.6)*.015),it=[];
for(const p of SH){const q=rot(p,ang+ax,ay+.25),j=1+Math.sin(T*3+p[1]*9+p[0]*5)*level*.2,s=proj(q,R*j,c);it.push([q[2],s[0],s[1],s[2],p[3],1])}
for(const p of IN){const q=rot(p,-ang*1.8+ax,ay-.3),s=proj(q,R*.52*(1+level*.5),c);it.push([q[2],s[0],s[1],s[2],p[3],.8])}
it.sort((a,b)=>a[0]-b[0]);
for(const d of it){const k=(d[0]+1)/2,z=(7+k*15)*d[3]*d[5];cx.globalAlpha=.25+k*.6;cx.drawImage(SP[d[4]],d[1]-z/2,d[2]-z/2,z,z)}
cx.globalAlpha=.16+level*.4;cx.drawImage(SP[3],c[0]-R*.75,c[1]-R*.75,R*1.5,R*1.5);cx.globalAlpha=1;
cx.lineWidth=2.5;
for(let r=0;r<4;r++){const pts=[];for(let i=0;i<=90;i++){const t=i/90*6.2832,q=rot(rot([Math.cos(t)*1.2,0,Math.sin(t)*1.2],0,r*.8+ang*.45),ang*.3*(r%2?-1:1)+ax+r*.9,ay),s=proj(q,R,c);pts.push(s.concat(q[2]))}
for(let i=0;i<90;i++){const a=pts[i],b=pts[i+1],k=(a[3]+1.2)/2.4;cx.strokeStyle=`rgba(${r%2?'60,230,255':'40,255,150'},${.1+k*.55})`;cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()}
